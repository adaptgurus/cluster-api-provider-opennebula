name: Clusterctl metadata contract

on:
  push:
    branches:
      - fix/clusterctl-metadata-v1beta2-compat-20260919
  pull_request:
    paths:
      - metadata.yaml
      - hack/verify-clusterctl-metadata.sh
      - .github/workflows/clusterctl-metadata.yml

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate clusterctl metadata
        run: bash hack/verify-clusterctl-metadata.sh metadata.yaml
